name: Update Semantic Index

on:
  push:
    paths:
      - 'content/**/*.md'   # article text changed
      - 'articles.json'     # articles added/removed/renamed
      - 'scripts/build-embeddings.mjs'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write        # Gives permission to commit the regenerated index

concurrency:
  group: semantic-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-embeddings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-all-MiniLM-L6-v2-q8-${{ hashFiles('package-lock.json') }}

      # Only articles whose markdown changed are re-embedded; --verify-model
      # re-embeds everything if the model's output ever changes.
      - name: Build semantic index
        run: node scripts/build-embeddings.mjs --verify-model

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add semantic-index.json

          # Commit only if there are changes to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "semantic-index.json is up to date"
            exit 0
          fi
          git commit -m "Auto-update semantic index"
          # The RSS workflow may have pushed in the meantime
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
